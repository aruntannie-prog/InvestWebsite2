<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosha Wealth — Invest with a plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F6F7FB;--sf:#FFFFFF;--sf2:#FAFBFD;--ink:#141845;--ink2:#2A3078;--tx:#262A44;--mu:#5D6280;--fa:#9196AF;--ln:#E3E5EF;--ln2:#EEF0F6;
 --go:#0C7C78;--go2:#08605D;--gold:#F0A92B;--gold2:#C98510;
 --lav:#EEF0FC;--mint:#E3F4F1;--sand:#FDF3E2;--rose:#FCEDEB;--sky:#E7F1FB;
 --up:#15885A;--dn:#C8402F;
 --sh1:0 1px 2px rgba(20,24,69,.05);--sh2:0 2px 4px rgba(20,24,69,.04),0 14px 34px -12px rgba(20,24,69,.14);--sh3:0 30px 80px -30px rgba(20,24,69,.35);
 --fd:"Sora",ui-sans-serif,system-ui,sans-serif;--fb:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --r1:8px;--r2:14px;--r3:22px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
 --bg:#0C0E1F;--sf:#14172E;--sf2:#111428;--ink:#EEEFFA;--ink2:#C7CAF2;--tx:#D9DBEA;--mu:#A0A4BE;--fa:#73789A;--ln:#262A48;--ln2:#1D2140;
 --go:#4FC1BA;--go2:#76D2CC;--gold:#F4B744;--gold2:#F4B744;
 --lav:#1B1F44;--mint:#123131;--sand:#2D2614;--rose:#33191A;--sky:#132A40;--up:#4CC88E;--dn:#F07F70;
 --sh1:none;--sh2:none;--sh3:0 30px 80px -30px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5{margin:0;font-family:var(--fd);color:var(--ink);font-weight:600;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(2.4rem,5vw,4.1rem);letter-spacing:-.035em;line-height:1.04;font-weight:700}
h2{font-size:clamp(1.75rem,3.1vw,2.6rem);letter-spacing:-.03em}
h3{font-size:1.2rem}h4{font-size:1.02rem}
p{margin:0}a{color:inherit}
button,input,select{font:inherit;color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.n{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.fa{color:var(--fa)}.sm{font-size:.9rem}.xs{font-size:.8rem}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
.w{max-width:1260px;margin:0 auto;padding:0 32px}
@media(max-width:640px){.w{padding:0 20px}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:.96rem;padding:14px 24px;border-radius:12px;white-space:nowrap;transition:transform .15s,background .2s,box-shadow .2s,color .2s}
.b:active{transform:translateY(1px)}
.b-go{background:var(--go);color:#fff;box-shadow:0 8px 20px -10px var(--go)}.b-go:hover{background:var(--go2)}
:root[data-theme="dark"] .b-go{color:#05201F}
.b-ink{background:var(--ink);color:var(--sf)}
.b-gold{background:var(--gold);color:#2A1A00}
.b-ln{background:var(--sf);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ln)}.b-ln:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.b-gh{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}.b-gh:hover{background:rgba(255,255,255,.14)}
.b-sm{padding:9px 16px;font-size:.88rem;border-radius:10px}
.lk{color:var(--go);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;font-size:.95rem}
.lk svg{width:16px;height:16px;transition:transform .2s}.lk:hover svg{transform:translateX(3px)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;cursor:pointer;color:var(--mu);position:relative;padding:0}
.ib:hover{color:var(--ink);border-color:var(--ink)}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#2A1A00;font-size:.7rem;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.cnt[hidden]{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--lav);color:var(--ink2)}
.pill.g{background:var(--mint);color:var(--go)}.pill.o{background:var(--sand);color:var(--gold2)}
.logo{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:var(--fd);font-weight:700;font-size:1.28rem;letter-spacing:-.03em;white-space:nowrap}
.logo svg{width:32px;height:32px}
/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* ============ PUBLIC: header ============ */
.ann{background:var(--ink);color:#C9CCEA;font-size:.86rem;text-align:center;padding:9px 16px}
.ann a{color:#fff;font-weight:600}
:root[data-theme="dark"] .ann{background:#080A18}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--ln)}
.hd .w{display:flex;align-items:center;gap:36px;height:76px}
.mm{display:flex;gap:4px;list-style:none;margin:0;padding:0;height:100%}
.mm>li{position:relative;display:flex;align-items:center}
.mm>li>a,.mm>li>button{white-space:nowrap;display:flex;align-items:center;gap:6px;height:100%;padding:0 14px;background:none;border:0;cursor:pointer;font-weight:600;color:var(--mu);text-decoration:none;font-size:.96rem}
.mm>li>a:hover,.mm>li>button:hover,.mm>li.on>a,.mm>li.on>button{color:var(--ink)}
.mm .cv{width:14px;height:14px;transition:transform .2s}
.mm>li:hover .cv{transform:rotate(180deg)}
.mega{position:absolute;top:calc(100% - 6px);left:-20px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh3);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 240px;gap:6px;width:760px;opacity:0;visibility:hidden;transform:translateY(8px);transition:all .2s}
.mm>li:hover .mega,.mm>li:focus-within .mega{opacity:1;visibility:visible;transform:none}
.mega a{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:12px;border-radius:12px;text-decoration:none;align-items:center}
.mega a:hover{background:var(--bg)}
.mega .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.mega b{display:block;color:var(--ink);font-size:.95rem}.mega span{font-size:.82rem;color:var(--mu);line-height:1.35}
.mega .feat{grid-row:span 3;background:var(--ink);border-radius:14px;padding:20px;color:#C9CCEA;display:flex;flex-direction:column;gap:10px;text-decoration:none}
.mega .feat b{color:#fff;font-family:var(--fd);font-size:1.1rem;line-height:1.25}
.mega .feat span{color:#C9CCEA}
.mega.sm2{width:520px;grid-template-columns:1fr 1fr}
.hact{margin-left:auto;display:flex;gap:10px;align-items:center}
.hact .lg{white-space:nowrap;background:none;border:0;font-weight:600;cursor:pointer;color:var(--ink);padding:10px}
.bur{display:none}
@media(max-width:1080px){.mm{display:none}.bur{display:grid}.mm.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:76px;height:auto;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 20px 20px}.mm.open>li>a,.mm.open>li>button{padding:14px 0;height:auto}.mm.open .mega{display:none}}
@media(max-width:560px){.hact .lg,.hact .hs{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--sf)}
.hero::before{content:"";position:absolute;inset:auto -10% -40% 40%;height:120%;background:radial-gradient(closest-side,var(--lav),transparent);opacity:.9;pointer-events:none}
.hero .w{position:relative;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:88px}
@media(max-width:1000px){.hero .w{grid-template-columns:1fr;padding-top:48px;padding-bottom:56px}}
.hero h1 .rot{display:inline-block;position:relative;color:var(--go)}
.hero h1 .rot::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.14em;background:var(--gold);opacity:.45;border-radius:4px;z-index:-1}
.hero .lede{font-size:1.2rem;color:var(--mu);max-width:47ch;margin-top:24px;line-height:1.55}
.hero .cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;align-items:center}
.hero .proof{display:flex;align-items:center;gap:14px;margin-top:40px;font-size:.9rem;color:var(--mu)}
.faces{display:flex}.faces span{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--sf);margin-left:-10px;display:grid;place-items:center;font-weight:700;font-size:.66rem;color:#fff}
.faces span:first-child{margin-left:0}
.proof b{color:var(--ink)}
.stage{position:relative;height:520px}
@media(max-width:1000px){.stage{height:440px;max-width:560px}}
@media(max-width:560px){.stage{height:360px}}
.stage .art{position:absolute;inset:0 0 0 40px;border-radius:32px;overflow:hidden;background:var(--ink)}
@media(max-width:560px){.stage .art{inset:0}}
.stage .art svg{width:100%;height:100%}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.scene.on{opacity:1}
.float{position:absolute;background:var(--sf);border-radius:18px;box-shadow:var(--sh3);padding:16px 18px;animation:bob 6s ease-in-out infinite}
.float small{display:block;color:var(--mu);font-size:.78rem}
.float b{font-family:var(--fd);color:var(--ink)}
.f1{left:0;top:56px;width:236px}
.f2{right:0;bottom:84px;width:250px;animation-delay:-2s}
.f3{left:28px;bottom:-14px;width:200px;animation-delay:-4s}
@media(max-width:560px){.f1{left:10px;top:14px;width:200px}.f2{right:10px;bottom:56px;width:180px}.f3{display:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ring,.float svg.rg{width:54px;height:54px;flex:none}
.mini-area{width:100%;height:46px;margin-top:8px}
/* trust band */
.trust{background:var(--sf);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.trust .w{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:0}
.trust .t{padding:30px 24px;border-right:1px solid var(--ln)}
.trust .t:first-child{padding-left:0}
.trust .t b{display:block;font-family:var(--fd);font-size:2rem;color:var(--ink);letter-spacing:-.04em;line-height:1.1}
.trust .t span{font-size:.88rem;color:var(--mu)}
.trust .reg{padding:24px 0 24px 28px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:.84rem;color:var(--mu)}
.trust .reg div{display:flex;gap:10px;align-items:center}
.trust .reg svg{color:var(--go)}
@media(max-width:1000px){.trust .w{grid-template-columns:1fr 1fr}.trust .t:nth-child(2n){border-right:0}.trust .t{border-bottom:1px solid var(--ln);padding-left:0}.trust .reg{grid-column:1/-1;padding-left:0}}
/* section scaffold */
.sec{padding:120px 0;position:relative}
.sec.s2{background:var(--sf)}
.sec.tight{padding:88px 0}
@media(max-width:760px){.sec{padding:76px 0}}
.eyb{display:inline-flex;align-items:center;gap:10px;font-weight:600;color:var(--go);font-size:.95rem;margin-bottom:16px}
.eyb::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
.shd{max-width:720px;margin-bottom:56px}
.shd p{color:var(--mu);font-size:1.12rem;margin-top:16px;max-width:58ch}
.shd.c{text-align:center;margin-left:auto;margin-right:auto}.shd.c .eyb{justify-content:center}
.shd.row{max-width:none;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.shd.row>div{max-width:680px}
/* product showcase */
.show{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:stretch}
@media(max-width:960px){.show{grid-template-columns:1fr}}
.tabsv{display:flex;flex-direction:column;gap:4px}
@media(max-width:960px){.tabsv{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.tabsv button{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:16px;padding:14px;cursor:pointer;transition:all .2s}
@media(max-width:960px){.tabsv button{flex:none;grid-template-columns:36px auto}}
.tabsv button .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
@media(max-width:960px){.tabsv button .ti{width:36px;height:36px}}
.tabsv button b{display:block;color:var(--ink);font-family:var(--fd);font-weight:600;font-size:1rem}
.tabsv button span{font-size:.84rem;color:var(--mu)}
@media(max-width:960px){.tabsv button span{display:none}}
.tabsv button[aria-selected="true"]{background:var(--sf);border-color:var(--ln);box-shadow:var(--sh2)}
.spanel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:460px;box-shadow:var(--sh2)}
@media(max-width:760px){.spanel{grid-template-columns:1fr}}
.spanel .txt{padding:44px;display:flex;flex-direction:column;gap:18px}
@media(max-width:640px){.spanel .txt{padding:28px}}
.spanel h3{font-size:1.8rem;letter-spacing:-.03em}
.spanel ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.spanel li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--mu)}
.spanel li svg{color:var(--go);margin-top:3px}
.spanel .facts{display:flex;gap:28px;margin-top:auto;padding-top:20px;border-top:1px dashed var(--ln)}
.spanel .facts b{display:block;font-family:var(--fd);font-size:1.3rem;color:var(--ink)}
.spanel .facts span{font-size:.82rem;color:var(--mu)}
.spanel .vis{background:var(--lav);position:relative;display:grid;place-items:center;padding:36px;overflow:hidden}
.mock{background:var(--sf);border-radius:18px;box-shadow:var(--sh3);width:100%;max-width:380px;padding:18px;display:grid;gap:12px;animation:rise .6s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.mock .mh{display:flex;justify-content:space-between;align-items:center}
.mock .mh b{font-family:var(--fd);color:var(--ink);font-size:.95rem}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--bg)}
.mrow b{font-size:.86rem;color:var(--ink);display:block;line-height:1.25}.mrow small{font-size:.74rem;color:var(--mu)}
.amc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.72rem;font-family:var(--fd);flex:none}
/* calculator */
.calcw{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);box-shadow:var(--sh2);overflow:hidden}
.ctabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--ln);overflow-x:auto;background:var(--sf2)}
.ctabs button{border:0;background:transparent;padding:10px 18px;border-radius:10px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}
.ctabs button[aria-selected="true"]{background:var(--sf);color:var(--ink);box-shadow:var(--sh2)}
.cbody{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
@media(max-width:900px){.cbody{grid-template-columns:1fr}}
.cin{padding:36px;border-right:1px solid var(--ln)}
@media(max-width:900px){.cin{border-right:0;border-bottom:1px solid var(--ln)}}
@media(max-width:640px){.cin{padding:24px}}
.fl{margin-bottom:28px}
.fl .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px 12px;flex-wrap:wrap}
.fl label{font-weight:600;color:var(--tx);font-size:.95rem}
.fl .val{display:flex;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:0 12px;height:40px;min-width:112px;margin-left:auto}
.fl .val span{color:var(--mu);font-weight:600}
.fl .val input{border:0;background:transparent;outline:0;width:100%;text-align:right;font-weight:700;color:var(--ink);font-family:var(--fd)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--go) var(--p,50%),var(--ln2) var(--p,50%));outline:none;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sf);border:5px solid var(--go);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--sf);border:5px solid var(--go)}
.tog{display:flex;align-items:center;gap:12px;font-size:.92rem;color:var(--mu);cursor:pointer}
.tog input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--ln);position:relative;cursor:pointer;transition:background .2s;margin:0}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked{background:var(--go)}.tog input:checked::after{transform:translateX(18px)}
.cout{padding:36px;display:grid;gap:22px;align-content:start}
@media(max-width:640px){.cout{padding:24px}}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.res div{padding:16px 18px}.res div+div{border-left:1px solid var(--ln)}
.res small{display:block;color:var(--mu);font-size:.8rem}
.res b{font-family:var(--fd);font-size:1.25rem;color:var(--ink)}
.res .hl{background:var(--ink);}.res .hl small{color:#B8BCE0}.res .hl b{color:#fff;font-size:1.45rem}
:root[data-theme="dark"] .res .hl{background:#1F2458}
@media(max-width:560px){.res{grid-template-columns:1fr}.res div+div{border-left:0;border-top:1px solid var(--ln)}}
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:.8rem;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:3}
.tip b{font-family:var(--fd)}
.lgd{display:flex;gap:22px;font-size:.86rem;color:var(--mu);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(150px,auto);gap:20px}
.bt{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);padding:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.bt h3{font-size:1.35rem;letter-spacing:-.025em}
.bt p{color:var(--mu)}
.b1{grid-column:span 7;grid-row:span 2;background:var(--ink);border:0;color:#C9CCEA}
.b1 h3{color:#fff;font-size:1.8rem;max-width:16ch}.b1 p{color:#B8BCE0;max-width:42ch}
:root[data-theme="dark"] .b1{background:#1A1E4A}
.b2{grid-column:span 5;background:var(--mint);border-color:transparent}
.b3{grid-column:span 5;background:var(--sand);border-color:transparent}
.b4{grid-column:span 4}.b5{grid-column:span 4}.b6{grid-column:span 4}
@media(max-width:960px){.b1,.b2,.b3{grid-column:span 12}.b4,.b5,.b6{grid-column:span 12}}

function spk(vals,col,w=200,h=40){const s=sparkPath(vals,w,h);const id='g'+Math.random().toString(36).slice(2,8);return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${s.area}" fill="url(#${id})"/><path d="${s.d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

 const X=i=>P.l+(i/(n-1))*(W-P.l-P.r),Y=v=>H-P.b-((v-mn)/(mx-mn||1))*(H-P.t-P.b);const id='c'+Math.random().toString(36).slice(2,8);
 let g='';if(cfg.yl!==false)for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)" ${k?'stroke-dasharray="3 5"':''}/><text x="${P.l-10}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--fa)">${(cfg.fmt||L)(v).replace('₹','₹')}</text>`}

 if(cfg.draw)el.querySelectorAll('.draw').forEach(p=>{const l=p.getTotalLength?p.getTotalLength():2000;p.style.setProperty('--len',l)});

  hl.setAttribute('x1',X(i));hl.setAttribute('x2',X(i));hl.setAttribute('opacity',1);cfg.series.forEach((s,si)=>{const d=el.querySelector('.hd'+si);d.setAttribute('cx',X(i));d.setAttribute('cy',Y(s.v[i]));d.setAttribute('opacity',1)});
  tip.innerHTML=`<div style="opacity:.7;margin-bottom:3px">${lbl[i]??''}</div>`+cfg.series.map(s=>`<div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:6px"></span>${s.n}: <b>${(cfg.tfmt||L)(s.v[i])}</b></div>`).join('');

function donut(parts,size=180,th=26,center=''){const r=(size-th)/2,C2=2*Math.PI*r;let a=0;return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln2)" stroke-width="${th}"/>${parts.map(p=>{const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p[1]}" stroke-width="${th}" stroke-dasharray="${Math.max(0,p[2]/100*C2-3)} ${C2}" stroke-dashoffset="${-a/100*C2}" transform="rotate(-90 ${size/2} ${size/2})"/>`;a+=p[2];return s}).join('')}${center}</svg>`}
function ring(p,col,size=62,th=7,label=''){const r=(size-th)/2,C2=2*Math.PI*r;return `<svg class="rg" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln2)" stroke-width="${th}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${p/100*C2} ${C2}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="Sora,sans-serif" font-weight="700" font-size="${size*.22}" fill="var(--ink)">${label||Math.round(p)+'%'}</text></svg>`}

function countUp(el){if(el._d)return;el._d=1;const to=+el.dataset.to,dec=+(el.dataset.dec||0),pre=el.dataset.pre||'',suf=el.dataset.suf||'';const t0=performance.now(),D=1600;
 const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=pre+(to*e).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(p<1)requestAnimationFrame(f)};
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)el.textContent=pre+to.toLocaleString('en-IN',{minimumFractionDigits:dec})+suf;else requestAnimationFrame(f)}

const cart=new Map();
const put=id=>cart.set(id,{t:'sip',k:'Regular',amt:5000});
